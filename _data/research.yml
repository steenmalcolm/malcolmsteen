- title: 'Ternary mixtures and their equilibrium profiles'
  description: 'Building on this, I next looked at the equilibrium profiles of ternary mixtures. These follow from the Euler–Lagrange equations, though solving them directly is intractable. Instead, I developed an analytical approximation that only requires information about the bulk phases, yet still lets us calculate important thermodynamic properties like surface tension. To check the accuracy of this approach, I also run field-based simulations. For this, I developed a semi-implicit solver that essentially acts as a low-pass filter, allowing time steps orders of magnitude larger than before and greatly improving efficiency.
  image: 'assets/img/home.jpg'

- title: 'Air Cargo Network Optimization'
  description: 'As part of a one year contract from the U.S. Air Force, I set out to build a quantum solution for routing air cargo flights. The problem is what’s called “frustrated,” which is why most classical sequential algorithms struggle. At the same time, the system is far too large to embed directly on today’s Noisy Intermediate Scale Quantum (NISQ) devices. To get around this, I designed a hybrid quantum–classical algorithm that breaks the problem into smaller pieces solvable on current hardware. This works because, even though the system is frustrated, it still has local symmetries that can be exploited to shrink the effective problem size. On the quantum side, much of my work focused on fine-tuning schemes to balance two competing goals: achieving high-quality solutions while still satisfying strict constraints. This first stage of the work wrapped up with promising results, leading directly into a second phase with the U.S. Air Force.'
  image: 'assets/img/home.jpg'
