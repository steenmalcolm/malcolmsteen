- title: 'Surface Tension in Ternary Mixtures (Masters Thesis Ongoing)'
  description: |
    Most of what we know about phase separation comes from studies of binary mixtures, but ternary mixtures are much less understood. In my project I look at some of the unique properties of these systems.
    To begin, I turned to the free energy and using a three state Ising model, uncovered how local and gradient energy terms can be related.
    Building on this, I looked at the equilibrium profiles of ternary mixtures. Their shape follows from the Euler-Lagrange equations, though solving them directly is intractable. Instead, I developed an analytical approximation that only requires information about the bulk phases, yet still lets us calculate important thermodynamic properties like the surface tension (see figure).
    To check the accuracy of this approach, I also run field-based simulations. For this, I developed a semi-implicit solver that essentially acts as a low-pass filter, allowing time steps orders of magnitude larger than before and greatly improving efficiency.
    I am increadibly lucky to be working on this project with David Zwicker, whose deep physical intuition and expertise in phase separation have been invaluable and Stefan Köster, who has provided essential guidance on both the theoretical and numerical aspects.
  image: 'assets/img/surfacetension.png'

- title: 'Coexistence Curve (Masters Thesis Ongoing)'
  description: |
    Finding the binodal for multicomponent mixtures is computationally expensive, especially when the interactions between species changes.
    In this project, I set out to develope a stepping scheme which traces out the coexistence curve by expanding the excess chemical potential and osmotic pressure to first order. This method is strikingly efficient, allowing us to compute the entire phase diagram to arbitrarily high precision in a matter of seconds.
    This lays the groundwork for multiple exciting applications, such as classifying the possible topologies of ternary phase diagrams or uncovering design rules for targeted phase behavior in mixtures with more components.
    One can also use the same framework to quantify the susceptibility of condensates to perturbations in the interaction matrix, which has practical implications for understanding how robust phase behavior is to changes in environmental conditions.
  image: 'assets/img/binodal_stepper.png'

- title: 'Air Cargo Network Optimization (SavantX)'
  description: |
    As part of a one year contract from the U.S. Air Force, I set out to build a quantum solution for routing air cargo flights.
    The problem is “frustrated,” so most classical heuristics tend to get stuck in local minima. Quantum approaches can, in principle, traverse these landscapes more effectively, using interference and tunneling to make non-local moves, but the full problem is still too large to embed on today’s NISQ hardware.
    To get around this, I designed a hybrid quantum-classical algorithm that breaks the problem into smaller pieces solvable on current hardware. This works because, even though the system is frustrated, it still has local symmetries that can be exploited to shrink the effective problem size.
    On the quantum side, much of my work focused on fine-tuning schemes to balance two competing goals: achieving high-quality solutions while still satisfying hard constraints.
    This first stage of the work wrapped up with promising results, leading directly into a second phase with the U.S. Air Force.
  image: 'assets/img/airforce.jpg'

- title: 'Cosmological Simulation (Bachelor Thesis)'
  description: |
    In my bachelor thesis, I adapted the cosmological simulation codebase <a href="https://arxiv.org/abs/1604.06065"><em>gevolution</em></a> to study how temporal perturbations to cosmological parameters affect structure formation.
    One of the main findings was that perturbations to the gravitational potential are far more time-sensitive than those to the Hubble parameter. This likely stems from the fact that the potential depends on the inverse square of distance, making it highly responsive to even small changes in the matter distribution—whereas the Hubble parameter behaves more like a spatial average.
    This project required me to understand every component of running an efficient N-body simulation: mapping particles to a mesh, solving for the gravitational potential in Fourier space, and evolving particles using a leapfrog integrator. The video is from my own <a href="https://github.com/steenmalcolm/n_body_simulation"><em>N-body simulation code</em></a>.

    You can read the full thesis <a href="{{ site.baseurl }}\assets\files\Bachelorarbeit.pdf"><em>here</em></a>.
  video: 'assets/videos/simulation.mp4'

- title: "SSH Tunneling (Research Assistant)"
  description: |
    As a research assistant, I helped develop the <a href="https://vispa.physik.rwth-aachen.de/index.html"><em>Vispa platform</em></a>, a web interface for running physics analyses on remote HPC clusters.
    My main contribution was implementing SSH tunneling so users could securely reach internal services and compute nodes behind the gateway host with a single click.
    On the front end, I built a simple UI for managing SSH keys and connections. On the back end, I wired up port forwarding and key provisioning to establish and tear down tunnels reliably.
    I don’t plan to go into web development, yet I liked learning async JavaScript, putting together React front ends, and discovering the nuances of web security.
  image: 'assets/img/vispa.png'
