---
layout: default
---

{{ content }}

<div class="row g-5 mb-5">
  <div>
    <div class="row g-5 mb-5">
      {% for project in site.data.research %}
      <div class="row g-5 mb-5">
        <!-- Text column -->
        <div class="col-md-8 d-flex flex-column justify-content-center">
          <h5>{{ project.title }}</h5>
          <p>{{ project.description | newline_to_br }}</p>

        </div>

        <div class="col-md-4">
          {% if project.video %}
          <video controls class="img-fluid rounded" style="max-width: 450px; heigh: auto;">
            <source src=" {{ project.video }}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          {% endif %}
          {% if project.image %}
          <a>{{ site.baseurl }}</a>
          <img src="{{ project.image }}" alt="{{ project.title }}" class="img-fluid rounded"
            style="max-width: 550px; heigh: auto;">
          {% endif %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
